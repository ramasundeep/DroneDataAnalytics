; CD Sim - engine configuration.
; UNVERIFIED BUILD - not yet compiled; see docs/BUILDING_UE5.md

[/Script/EngineSettings.GameMapsSettings]
; TODO(Phase 1): replace with /Game/CDSim/Maps/L_FlatTest once the first map
; is authored. Until then the engine's empty Entry map is used and
; UCDSimAreaLoader spawns the flat ground plane, light and pads itself.
GameDefaultMap=/Engine/Maps/Entry
EditorStartupMap=/Engine/Maps/Entry
ServerDefaultMap=/Engine/Maps/Entry
GlobalDefaultGameMode=/Script/CDSim.CDSimGameMode
GlobalDefaultServerGameMode=/Script/CDSim.CDSimGameMode
GameInstanceClass=/Script/CDSim.CDSimGameInstance

[/Script/HardwareTargeting.HardwareTargetingSettings]
TargetedHardwareClass=Desktop
AppliedTargetedHardwareClass=Desktop
DefaultGraphicsPerformance=Maximum
AppliedDefaultGraphicsPerformance=Maximum

[/Script/Engine.RendererSettings]
r.DefaultFeature.AutoExposure=False
; Forward shading is what the VR configuration wants; desktop is unaffected
; visually for the placeholder content. Revisit when real terrain lands (Phase 2).
r.ForwardShading=False

[/Script/Engine.Engine]
; Offline-first: nothing here may reach the internet at runtime.
bSmoothFrameRate=False
bUseFixedFrameRate=False

; ---------------------------------------------------------------------------
; VR is a CONFIGURATION, not a fork (docs/ADR/0011).
;
; The OpenXR plugin is enabled in CDSim.uproject for every client build, but
; XR stays INACTIVE on desktop. XR is switched on only when either:
;   * the process is started with -vr, or
;   * the console variable cdsim.XR.Enable is 1 (set here, via
;     -ini:Engine:[ConsoleVariables]:cdsim.XR.Enable=1, or -DPCVars=cdsim.XR.Enable=1).
; UCDSimXRSettings (Source/CDSim/XR) reads it at game start. Keep 0 here.
; ---------------------------------------------------------------------------
[ConsoleVariables]
cdsim.XR.Enable=0

[Core.Log]
LogCDSim=Log
