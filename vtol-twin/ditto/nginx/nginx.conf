# nginx front for Eclipse Ditto (adapted from the Ditto reference deployment).
# Terminates HTTP basic auth and forwards the identity as "nginx:<user>" via x-ditto-pre-authenticated.
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  charset utf-8;
  default_type application/json;
  server_tokens off;

  proxy_connect_timeout 70;
  proxy_send_timeout 70;
  proxy_read_timeout 70;
  send_timeout 70;

  client_header_buffer_size 8k;
  large_client_header_buffers 4 16k;
  merge_slashes off;

  server {
    listen 80;
    server_name localhost;

    location / {
      index index.html;
    }

    # connections API: guarded by Ditto's own devops basic auth, so no nginx auth here
    location /api/2/connections {
      include nginx-cors.conf;
      proxy_pass                    http://gateway:8080;
      proxy_http_version            1.1;
      proxy_set_header              Host                $http_host;
      proxy_set_header              X-Real-IP           $remote_addr;
      proxy_set_header              X-Forwarded-For     $proxy_add_x_forwarded_for;
      proxy_set_header              X-Forwarded-User    $remote_user;
      proxy_set_header Connection  '';
      chunked_transfer_encoding    off;
      proxy_buffering              off;
      proxy_cache                  off;
    }

    location /api {
      include nginx-cors.conf;
      auth_basic                    "VTOL-1 twin";
      auth_basic_user_file          nginx.htpasswd;
      proxy_pass                    http://gateway:8080;
      proxy_http_version            1.1;
      proxy_set_header              Host                      $http_host;
      proxy_set_header              X-Real-IP                 $remote_addr;
      proxy_set_header              X-Forwarded-For           $proxy_add_x_forwarded_for;
      proxy_set_header              X-Forwarded-User          $remote_user;
      proxy_set_header              x-ditto-pre-authenticated "nginx:${remote_user}";
      proxy_set_header Connection  '';
      chunked_transfer_encoding    off;
      proxy_buffering              off;
      proxy_cache                  off;
    }

    location /ws {
      auth_basic                    "VTOL-1 twin";
      auth_basic_user_file          nginx.htpasswd;
      proxy_pass                    http://gateway:8080;
      proxy_http_version            1.1;
      proxy_set_header              Host                      $http_host;
      proxy_set_header              X-Real-IP                 $remote_addr;
      proxy_set_header              X-Forwarded-For           $proxy_add_x_forwarded_for;
      proxy_set_header              X-Forwarded-User          $remote_user;
      proxy_set_header              x-ditto-pre-authenticated "nginx:${remote_user}";
      proxy_set_header              Upgrade             $http_upgrade;
      proxy_set_header              Connection          "upgrade";
      proxy_read_timeout            1d;
      proxy_send_timeout            1d;
    }

    location /health {
      include nginx-cors.conf;
      proxy_pass                    http://gateway:8080;
      proxy_http_version            1.1;
      proxy_set_header              Host                $http_host;
    }

    location /status {
      include nginx-cors.conf;
      proxy_pass                    http://gateway:8080/overall/status;
      proxy_http_version            1.1;
      proxy_set_header              Host                $http_host;
    }

    location /devops {
      include nginx-cors.conf;
      proxy_pass                    http://gateway:8080;
      proxy_http_version            1.1;
      proxy_set_header              Host                $http_host;
    }

    location /ui/ {
      proxy_pass                    http://ditto-ui:8080/;
      proxy_http_version            1.1;
      proxy_set_header              Host                $http_host;
    }
  }
}
