# Dashboards are provisioned as code from ./dashboards (mounted at /var/lib/grafana/dashboards).
apiVersion: 1
providers:
  - name: vtol-twin
    orgId: 1
    folder: VTOL-1
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
