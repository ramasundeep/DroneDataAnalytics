# Mosquitto broker for the VTOL-1 twin.
# Single-operator bench setup: anonymous clients allowed on the compose network / localhost.
# For a field deployment add a password_file and TLS listener; Ditto's connection URI then
# carries the credentials (see docs/architecture.md, "Security posture").
listener 1883 0.0.0.0
protocol mqtt
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
autosave_interval 60

max_queued_messages 10000
message_size_limit 262144

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
