# CD Sim Instructor Console — nginx site config (serves the built SPA).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Liveness for the compose health check.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # API proxy. The upstream is resolved per request through Docker's
    # embedded DNS, so the console starts (and reports "API unreachable")
    # even when the API container is down. /api/v1/x reaches the API as /v1/x.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $cdsim_api http://api:8000;

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $cdsim_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Hashed build assets can be cached aggressively.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback: client-side routes resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
