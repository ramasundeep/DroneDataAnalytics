# Builds the documentation site with --strict so broken links and missing
# pages fail the check. The built site is uploaded as an artifact for review.
name: docs

on:
  push:
    branches: [main]
  pull_request:
    paths: ["docs/**", "mkdocs.yml", "README.md", "CLAUDE.md", "CONTRIBUTING.md"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: mkdocs build --strict
      - uses: actions/upload-artifact@v4
        with:
          name: cdsim-docs-site
          path: site/
          retention-days: 14
